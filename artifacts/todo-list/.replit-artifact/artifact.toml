kind = "mobile"
previewPath = "/"
title = "To-Do List"
description = "A simple personal to-do app for adding tasks, checking them off, removing finished items, and keeping the list saved on the device."
version = "1.0.0"
id = "artifacts/todo-list"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24804

[services.development]
run = "pnpm --filter @workspace/todo-list run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/todo-list", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/todo-list", "run", "serve" ]

[services.env]
PORT = "24804"
BASE_PATH = "/"
